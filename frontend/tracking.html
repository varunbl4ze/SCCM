<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Complaints — Civic Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="toastStack"></div>

<nav class="navbar navbar-expand-lg civic-nav">
  <div class="container-fluid px-3 px-lg-4">
    <button class="btn btn-civic-ghost mobile-sidebar-toggle me-2 d-none" id="sidebarToggle" aria-label="Toggle menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <a class="navbar-brand brand-lockup" href="index.html">
      <span class="civic-seal"><i class="fa-solid fa-leaf"></i></span>
      <span><span class="brand-text d-block">Civic Registry</span><span class="brand-sub d-block">Complaint Management</span></span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-2" id="navUserSlot"></div>
  </div>
</nav>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar">
    <span class="sidebar-section-label">Menu</span>
    <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="complaint.html" class="sidebar-link"><i class="fa-solid fa-circle-plus"></i> Raise Complaint</a>
    <a href="tracking.html" class="sidebar-link active"><i class="fa-solid fa-list-check"></i> Track Complaints</a>
    <a href="profile.html" class="sidebar-link"><i class="fa-solid fa-user"></i> Profile</a>
    <div class="sidebar-divider" id="adminDivider" style="display:none;"></div>
    <a href="admin.html" class="sidebar-link" id="adminSidebarLink" style="display:none;"><i class="fa-solid fa-shield-halved"></i> Admin Dashboard</a>
  </aside>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1>Track your complaints</h1>
        <p>Every issue you've filed, with live status.</p>
      </div>
      <div class="page-actions">
        <a href="complaint.html" class="btn btn-civic-primary"><i class="fa-solid fa-circle-plus me-1"></i> Raise complaint</a>
      </div>
    </div>

    <div class="filter-bar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" class="form-control" id="searchInput" placeholder="Search by title or docket number…">
      </div>
      <select class="form-select" id="statusFilter" style="max-width:180px;">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="in_progress">In Progress</option>
        <option value="resolved">Resolved</option>
        <option value="rejected">Rejected</option>
      </select>
      <select class="form-select" id="categoryFilter" style="max-width:180px;">
        <option value="">All categories</option>
        <option value="road">Road</option>
        <option value="water">Water</option>
        <option value="electricity">Electricity</option>
        <option value="sanitation">Sanitation</option>
        <option value="streetlight">Streetlight</option>
        <option value="drainage">Drainage</option>
        <option value="parks">Parks</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div id="resultCount" class="text-muted small mb-3"></div>
    <div id="complaintsList">
      <div class="skeleton" style="height:78px;margin-bottom:0.75rem;"></div>
      <div class="skeleton" style="height:78px;margin-bottom:0.75rem;"></div>
      <div class="skeleton" style="height:78px;margin-bottom:0.75rem;"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/tracking.js"></script>
</body>
</html>
