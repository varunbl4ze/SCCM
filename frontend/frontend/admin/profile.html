<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile & Settings — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div id="toastStack"></div>

<nav class="navbar navbar-expand-lg civic-nav">
  <div class="container-fluid px-3 px-lg-4">
    <button class="btn btn-civic-ghost mobile-sidebar-toggle me-2 d-none" id="sidebarToggle" aria-label="Toggle menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <a class="navbar-brand brand-lockup" href="../index.html">
      <span class="civic-seal"><i class="fa-solid fa-leaf"></i></span>
      <span>
        <span class="brand-text d-block">Civic Registry</span>
        <span class="brand-sub d-block">Admin Console</span>
      </span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-2" id="navUserSlot"></div>
  </div>
</nav>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">
  <aside class="app-sidebar admin-sidebar" id="appSidebar">
    <span class="admin-console-badge"><i class="fa-solid fa-shield-halved"></i> Admin Console</span>
    <span class="sidebar-section-label">Overview</span>
    <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <span class="sidebar-section-label">Operations</span>
    <a href="complaints.html" class="sidebar-link"><i class="fa-solid fa-clipboard-list"></i> Complaints</a>
    <a href="users.html" class="sidebar-link"><i class="fa-solid fa-users"></i> Users</a>
    <a href="departments.html" class="sidebar-link"><i class="fa-solid fa-building"></i> Departments</a>
    <a href="analytics.html" class="sidebar-link"><i class="fa-solid fa-chart-line"></i> Analytics</a>
    <span class="sidebar-section-label">Account</span>
    <a href="profile.html" class="sidebar-link active"><i class="fa-solid fa-user-gear"></i> Profile & Settings</a>
  </aside>

  <main class="app-main">
    <div class="page-head">
      <h1>Profile & settings</h1>
      <p>Your own admin account details.</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="civic-card p-4 text-center">
          <span class="profile-avatar mx-auto mb-3" style="width:72px;height:72px;font-size:1.5rem;" id="profileAvatar">–</span>
          <h5 class="mb-1" id="profileName">–</h5>
          <p class="text-muted-custom small mb-2" id="profileEmail">–</p>
          <span class="role-pill role-admin" id="profileRolePill">Admin</span>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="civic-card p-4 mb-4">
          <h5 class="mb-3">Account details</h5>
          <form id="adminProfileForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Full name</label>
                <input type="text" class="form-control" id="profileNameInput">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Email</label>
                <input type="email" class="form-control" id="profileEmailInput" disabled>
                <div class="form-text">Email changes aren't supported yet.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Phone</label>
                <input type="text" class="form-control" id="profilePhoneInput">
              </div>
            </div>
            <button type="submit" class="btn btn-civic-primary mt-3" id="saveProfileBtn">Save changes</button>
            <p class="small text-muted-custom mt-2 mb-0" id="profileUpdateNote"></p>
          </form>
        </div>

        <div class="civic-card p-4">
          <h5 class="mb-3">Change password</h5>
          <form id="adminChangePasswordForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Current password</label>
                <input type="password" class="form-control" id="currentPasswordInput">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">New password</label>
                <input type="password" class="form-control" id="newPasswordInput">
              </div>
            </div>
            <button type="submit" class="btn btn-civic-outline mt-3" id="changePasswordBtn">Update password</button>
            <p class="small text-muted-custom mt-2 mb-0" id="passwordUpdateNote"></p>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-profile.js"></script>
</body>
</html>
