<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complaint Details — Civic Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="toastStack"></div>

<nav class="navbar navbar-expand-lg civic-nav">
  <div class="container-fluid px-3 px-lg-4">
    <button class="btn btn-civic-ghost mobile-sidebar-toggle me-2 d-none" id="sidebarToggle" aria-label="Toggle menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <a class="navbar-brand brand-lockup" href="index.html">
      <span class="civic-seal"><i class="fa-solid fa-leaf"></i></span>
      <span><span class="brand-text d-block">Civic Registry</span><span class="brand-sub d-block">Complaint Management</span></span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-2" id="navUserSlot"></div>
  </div>
</nav>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar">
    <span class="sidebar-section-label">Menu</span>
    <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="complaint.html" class="sidebar-link"><i class="fa-solid fa-circle-plus"></i> Raise Complaint</a>
    <a href="tracking.html" class="sidebar-link active"><i class="fa-solid fa-list-check"></i> Track Complaints</a>
    <a href="profile.html" class="sidebar-link"><i class="fa-solid fa-user"></i> Profile</a>
    <div class="sidebar-divider" id="adminDivider" style="display:none;"></div>
    <a href="admin.html" class="sidebar-link" id="adminSidebarLink" style="display:none;"><i class="fa-solid fa-shield-halved"></i> Admin Dashboard</a>
  </aside>

  <main class="app-main">
    <a href="tracking.html" class="btn btn-civic-ghost btn-sm mb-3 ps-0"><i class="fa-solid fa-arrow-left me-1"></i> Back to tracking</a>

    <div id="detailsContent">
      <div class="skeleton" style="height:220px;margin-bottom:1rem;"></div>
      <div class="skeleton" style="height:120px;"></div>
    </div>
  </main>
</div>

<!-- Confirm cancel modal -->
<div class="modal fade" id="cancelModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:var(--radius-md);border:none;">
      <div class="modal-body p-4">
        <h5 class="mb-2">Withdraw this complaint?</h5>
        <p class="text-muted small mb-4">This permanently deletes the docket. This can't be undone.</p>
        <div class="d-flex gap-2 justify-content-end">
          <button type="button" class="btn btn-civic-ghost" data-bs-dismiss="modal">Keep it</button>
          <button type="button" class="btn btn-danger rounded-pill" id="confirmCancelBtn">Withdraw complaint</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/complaint-details.js"></script>
</body>
</html>
