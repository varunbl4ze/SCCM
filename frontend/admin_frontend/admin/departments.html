<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department Management — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div id="toastStack"></div>

<nav class="navbar navbar-expand-lg civic-nav">
  <div class="container-fluid px-3 px-lg-4">
    <button class="btn btn-civic-ghost mobile-sidebar-toggle me-2 d-none" id="sidebarToggle" aria-label="Toggle menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <a class="navbar-brand brand-lockup" href="../index.html">
      <span class="civic-seal"><i class="fa-solid fa-leaf"></i></span>
      <span>
        <span class="brand-text d-block">Civic Registry</span>
        <span class="brand-sub d-block">Admin Console</span>
      </span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-2" id="navUserSlot"></div>
  </div>
</nav>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">
  <aside class="app-sidebar admin-sidebar" id="appSidebar">
    <span class="admin-console-badge"><i class="fa-solid fa-shield-halved"></i> Admin Console</span>
    <span class="sidebar-section-label">Overview</span>
    <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <span class="sidebar-section-label">Operations</span>
    <a href="complaints.html" class="sidebar-link"><i class="fa-solid fa-clipboard-list"></i> Complaints</a>
    <a href="users.html" class="sidebar-link"><i class="fa-solid fa-users"></i> Users</a>
    <a href="departments.html" class="sidebar-link active"><i class="fa-solid fa-building"></i> Departments</a>
    <a href="analytics.html" class="sidebar-link"><i class="fa-solid fa-chart-line"></i> Analytics</a>
    <span class="sidebar-section-label">Account</span>
    <a href="profile.html" class="sidebar-link"><i class="fa-solid fa-user-gear"></i> Profile & Settings</a>
  </aside>

  <main class="app-main">
    <div class="page-head d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <h1>Department management</h1>
        <p>The departments complaints can be routed to for resolution.</p>
      </div>
      <button class="btn btn-civic-primary" data-bs-toggle="modal" data-bs-target="#departmentModal" id="newDepartmentBtn">
        <i class="fa-solid fa-plus me-1"></i> New department
      </button>
    </div>

    <div class="row g-3" id="departmentsGrid">
      <div class="col-12 text-center py-4 text-muted">Loading departments…</div>
    </div>
  </main>
</div>

<!-- Create/edit department modal -->
<div class="modal fade" id="departmentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius: var(--radius-md); border:none;">
      <div class="modal-header">
        <h5 class="modal-title" id="departmentModalTitle">New department</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="departmentId">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Name</label>
          <input type="text" class="form-control" id="departmentName" placeholder="e.g. Sanitation">
        </div>
        <div class="mb-2">
          <label class="form-label small fw-semibold">Description</label>
          <textarea class="form-control" id="departmentDescription" rows="3" placeholder="What this department handles…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-civic-ghost" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-civic-primary" id="saveDepartmentBtn">Save department</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-departments.js"></script>
</body>
</html>
